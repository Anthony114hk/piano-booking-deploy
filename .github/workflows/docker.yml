name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push (inline, full log capture)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -x
          mkdir -p /tmp/buildx-logs

          # Use the default 'docker' driver (host daemon) instead of 'docker-container'.
          # The docker-container driver maintains a persistent buildkit cache volume
          # across GHA runner invocations even when --no-cache is set, leading to
          # silent stale-push failures. Host driver has no such cache.
          docker buildx use default 2>&1 | tee /tmp/buildx-logs/00-driver.log || true
          docker buildx inspect --bootstrap 2>&1 | tee /tmp/buildx-logs/02-inspect.log

          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "Pushing as: ghcr.io/${OWNER}/piano-booking"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --no-cache \
            --build-arg "CACHE_BUST=${{ github.sha }}" \
            --tag "ghcr.io/${OWNER}/piano-booking:sha-${{ github.sha }}" \
            --tag "ghcr.io/${OWNER}/piano-booking:${VERSION}" \
            --push \
            . 2>&1 | tee /tmp/buildx-logs/03-build.log
          BUILD_EXIT=$?
          echo "exit=$BUILD_EXIT"

          # If VERSION is 'latest' and build succeeded, ensure 'latest' tag is updated.
          # Some buildx versions with --provenance=false + multi-tag only push the
          # last --tag, leaving 'latest' pointing at the previous image.
          if [[ "${VERSION}" == "latest" && "${BUILD_EXIT}" -eq 0 ]]; then
            echo "Tagging just-pushed image as 'latest'..."
            docker buildx imagetools create \
              -t "ghcr.io/${OWNER}/piano-booking:latest" \
              "ghcr.io/${OWNER}/piano-booking:sha-${{ github.sha }}" \
              2>&1 | tee /tmp/buildx-logs/05-imagetools.log || true
          fi

          exit $BUILD_EXIT

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: /tmp/buildx-logs/
          if-no-files-found: warn
