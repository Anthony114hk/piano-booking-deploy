name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push (inline, full log capture)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -x
          mkdir -p /tmp/buildx-logs
          docker buildx create \
            --name pb-builder \
            --driver docker-container \
            --bootstrap \
            --use 2>&1 | tee /tmp/buildx-logs/01-builder.log

          docker buildx inspect --bootstrap 2>&1 | tee /tmp/buildx-logs/02-inspect.log

          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "Pushing as: ghcr.io/${OWNER}/piano-booking"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --tag "ghcr.io/${OWNER}/piano-booking:${VERSION}" \
            --tag "ghcr.io/${OWNER}/piano-booking:sha-${{ github.sha }}" \
            --push \
            . 2>&1 | tee /tmp/buildx-logs/03-build.log
          EXIT=$?
          echo "exit=$EXIT"
          exit $EXIT

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: /tmp/buildx-logs/
          if-no-files-found: warn