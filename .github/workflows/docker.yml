name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/piano-booking:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/piano-booking:sha-${{ github.sha }}
          # No cache config — first build has no cache, and GHA cache backend
          # can error on cold start. The image is small enough (~250MB) that
          # rebuilds are fast without caching.

      - name: Upload build logs on failure
        if: failure() && steps.build.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            /tmp/*.log
            /tmp/*.txt
            ${{ github.workspace }}/buildx-output/
          if-no-files-found: ignore