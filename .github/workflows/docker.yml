name: Build and push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION="latest"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push (inline, full log capture)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -x
          mkdir -p /tmp/buildx-logs

          # Each GHA run gets a unique builder name so we don't reuse the
          # docker-container driver's persistent buildkit cache from a prior
          # run. --no-cache alone is not enough — the builder container itself
          # caches layers in its own volume.
          BUILDER="pb-builder-${{ github.run_id }}"
          docker buildx create \
            --name "${BUILDER}" \
            --driver docker-container \
            --bootstrap \
            --use 2>&1 | tee /tmp/buildx-logs/01-builder.log

          docker buildx inspect --bootstrap 2>&1 | tee /tmp/buildx-logs/02-inspect.log

          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "Pushing as: ghcr.io/${OWNER}/piano-booking"
          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --no-cache \
            --build-arg "CACHE_BUST=${{ github.sha }}" \
            --tag "ghcr.io/${OWNER}/piano-booking:sha-${{ github.sha }}" \
            --push \
            . 2>&1 | tee /tmp/buildx-logs/03-build.log
          BUILD_EXIT=$?
          echo "exit=$BUILD_EXIT"

          # If VERSION is "latest", explicitly update the latest tag too.
          # buildx with multiple --tag sometimes only pushes the last one
          # when --provenance=false; this ensures both tags point to the new image.
          if [[ "${VERSION}" == "latest" ]]; then
            echo "Updating latest tag to point at new sha-${SHA_SHORT} image..."
            docker buildx imagetools create \
              -t "ghcr.io/${OWNER}/piano-booking:latest" \
              "ghcr.io/${OWNER}/piano-booking:sha-${{ github.sha }}" \
              2>&1 | tee /tmp/buildx-logs/05-imagetools.log
          fi

          # Remove this run's builder so we don't leak docker-container instances.
          docker buildx rm "${BUILDER}" 2>&1 | tee /tmp/buildx-logs/04-cleanup.log || true

          exit $BUILD_EXIT

      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: /tmp/buildx-logs/
          if-no-files-found: warn